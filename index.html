<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GoTrix - GPS para Mobilidade Urbana</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts para a tipografia premium -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="family" />

  <style>
    body, html { 
      margin: 0; padding: 0; height: 100%; overflow: hidden; 
      font-family: 'Poppins', sans-serif;
      background-color: #0b0b0b;
    }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    
    /* Filtro escuro para o mapa se integrar com a identidade GoTrix */
    .dark-map {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    /* Customização da Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #e2b245;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-white">

  <!-- Painel Superior (Marca e Busca) -->
  <div class="fixed top-4 left-4 right-4 z-10 max-w-md mx-auto bg-[#0f0f0f]/95 backdrop-blur-md p-4 rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] border border-[#e2b245]/20">
    <div class="flex items-center justify-between mb-3">
      <!-- Identidade GoTrix -->
      <div class="flex items-center gap-1">
        <span class="text-2xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-[#e2b245] to-yellow-500">
          Go<span class="text-white">Trix</span>
        </span>
        <span class="text-[9px] uppercase tracking-widest text-[#e2b245] font-bold border border-[#e2b245]/30 px-1.5 py-0.5 rounded-md ml-1.5 bg-[#e2b245]/5">
          GPS
        </span>
      </div>
      
      <div class="flex items-center gap-1.5">
        <button onclick="centralizarUsuario()" class="text-xs bg-[#1a1a1a] hover:bg-[#262626] text-[#e2b245] hover:text-yellow-400 font-semibold px-2.5 py-1.5 rounded-lg border border-[#e2b245]/30 transition-all flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          Meu GPS
        </button>
      </div>
    </div>

    <!-- Campo de Busca -->
    <div class="flex gap-2">
      <input 
        type="text" 
        id="destino-input" 
        placeholder="Para onde vamos de Trix? (ou toque no mapa)" 
        class="w-full bg-[#161616] text-sm text-white placeholder-gray-500 px-3.5 py-2.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-[#e2b245] transition"
        onkeypress="if(event.key === 'Enter') buscarEndereco()"
      />
      <button 
        onclick="buscarEndereco()" 
        class="bg-gradient-to-r from-yellow-400 to-[#e2b245] hover:from-yellow-500 hover:to-yellow-600 text-black font-extrabold px-4.5 py-2.5 rounded-xl text-sm transition-all shadow-[0_0_15px_rgba(226,178,69,0.2)] shrink-0">
        Ir
      </button>
    </div>

    <!-- Painel de Informações da Rota -->
    <div id="info-rota" class="hidden mt-3 pt-3 border-t border-zinc-800 flex items-center justify-between text-sm animate-fade-in">
      <div>
        <p class="text-zinc-500 text-[10px] uppercase font-bold tracking-wider">Distância por vias seguras</p>
        <p id="distancia-texto" class="font-extrabold text-lg text-white">0 km</p>
      </div>
      <div class="text-right">
        <p class="text-zinc-500 text-[10px] uppercase font-bold tracking-wider">Tempo Estimado</p>
        <p id="tempo-texto" class="font-extrabold text-lg text-[#e2b245]">0 min</p>
      </div>
    </div>
  </div>

  <!-- Banner Promocional do Rodapé (Compacto e Fechável) -->
  <div id="ad-gotrix" class="fixed bottom-4 left-4 right-4 z-10 max-w-md mx-auto bg-gradient-to-b from-[#121212]/95 to-[#080808]/98 backdrop-blur-md px-3.5 py-3 rounded-2xl border border-[#e2b245]/25 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] transition-all duration-300 transform translate-y-0">
    <!-- Botão Fechar (X) -->
    <button onclick="fecharAnuncio()" class="absolute -top-2 -right-2 bg-[#161616] hover:bg-zinc-800 text-zinc-400 hover:text-[#e2b245] p-1 rounded-full border border-zinc-700/50 shadow-md transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>

    <div class="flex items-center gap-3">
      <!-- Imagem Miniatura da Scooter GoTrix -->
      <div class="relative w-14 h-14 bg-zinc-900 rounded-xl border border-zinc-800 overflow-hidden flex-shrink-0 flex items-center justify-center">
        <!-- Substitua pelo link de imagem real da GoTrix depois -->
        <img src="https://img.icons8.com/m_outlined/512/FFFFFF/electric-scooter.png" alt="Scooter" class="w-10 h-10 object-contain brightness-75 hover:brightness-100 transition" />
      </div>

      <!-- Texto e Conteúdo -->
      <div class="flex-grow min-w-0">
        <span class="text-[9px] uppercase tracking-widest text-[#e2b245] font-extrabold bg-[#e2b245]/10 px-1.5 py-0.5 rounded">
          Promoção de Lançamento
        </span>
        <h3 class="text-xs font-bold text-white mt-1 truncate">Venha conhecer a nova GoTrix!</h3>
        <p class="text-[10px] text-zinc-400 truncate">Rua Sete de Setembro, 123 - Centro | Seg-Sáb: 9h-19h</p>
      </div>

      <!-- Botão de Ação -->
      <a href="https://gotrixoficial.com.br" target="_blank" class="bg-gradient-to-r from-yellow-400 to-[#e2b245] hover:brightness-110 text-black font-bold text-[11px] px-3 py-2 rounded-lg transition-all shrink-0">
        Conhecer
      </a>
    </div>
  </div>

  <!-- Botão de Abrir Banner caso o usuário queira ver de novo (fica discreto no rodapé) -->
  <button id="btn-reabrir-ad" onclick="abrirAnuncio()" class="hidden fixed bottom-4 right-4 z-10 bg-[#0f0f0f]/90 text-[#e2b245] p-3 rounded-full border border-[#e2b245]/20 shadow-lg hover:bg-zinc-900 transition-all">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5a2 2 0 10-2 2h2z" /></svg>
  </button>

  <!-- Container do Mapa -->
  <div id="map" class="dark-map"></div>

  <script>
    // Coordenadas iniciais (Substitua se precisar)
    let posAtual = [-25.5347, -49.2064]; 
    let marcadorUsuario = null;
    let marcadorDestino = null;
    let linhaRota = null;

    // Inicialização do Mapa
    const map = L.map('map', { zoomControl: false }).setView(posAtual, 15);
    
    // Camada de mapa no estilo escuro de alta legibilidade (CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 20
    }).addTo(map);

    // Ícones customizados da marca (Preto e Dourado)
    const iconeUsuario = L.divIcon({
      className: 'custom-div-icon',
      html: `<div style="background-color:#e2b245; width:16px; height:16px; border-radius:50%; border:3px solid #000; box-shadow: 0 0 15px rgba(226,178,69,0.8);"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    const iconeDestino = L.divIcon({
      className: 'custom-div-icon',
      html: `<div style="background-color:#ffffff; width:16px; height:16px; border-radius:50%; border:3px solid #e2b245; box-shadow: 0 0 15px rgba(255,255,255,0.6);"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    // Função para fechar/ocultar o anúncio
    function fecharAnuncio() {
      const banner = document.getElementById('ad-gotrix');
      const btnAbrir = document.getElementById('btn-reabrir-ad');
      banner.style.opacity = '0';
      banner.style.transform = 'translateY(20px)';
      setTimeout(() => {
        banner.classList.add('hidden');
        btnAbrir.classList.remove('hidden');
      }, 300);
    }

    // Função para reabrir o anúncio
    function abrirAnuncio() {
      const banner = document.getElementById('ad-gotrix');
      const btnAbrir = document.getElementById('btn-reabrir-ad');
      btnAbrir.classList.add('hidden');
      banner.classList.remove('hidden');
      setTimeout(() => {
        banner.style.opacity = '1';
        banner.style.transform = 'translateY(0)';
      }, 50);
    }

    // Ativa GPS do navegador
    function iniciarGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const primeiraVez = !marcadorUsuario;
            posAtual = [lat, lng];

            if (!marcadorUsuario) {
              marcadorUsuario = L.marker(posAtual, { icon: iconeUsuario }).addTo(map);
            } else {
              marcadorUsuario.setLatLng(posAtual);
            }

            if (primeiraVez) {
              map.setView(posAtual, 16);
            }
          },
          (erro) => {
            console.warn("Erro ao obter GPS:", erro.message);
            if (!marcadorUsuario) {
              marcadorUsuario = L.marker(posAtual, { icon: iconeUsuario }).addTo(map);
            }
          },
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
      }
    }

    function centralizarUsuario() {
      map.flyTo(posAtual, 16);
    }

    // Busca Endereço (Photon)
    async function buscarEndereco() {
      const query = document.getElementById('destino-input').value.trim();
      if (!query) return;

      try {
        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=${posAtual[0]}&lon=${posAtual[1]}&limit=1`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.features && data.features.length > 0) {
          const coords = data.features[0].geometry.coordinates;
          definirDestinoECalcular(coords[1], coords[0]);
        } else {
          alert("Nenhum local encontrado com esse nome.");
        }
      } catch (e) {
        alert("Erro na busca do endereço.");
      }
    }

    // Clique no mapa
    map.on('click', (e) => {
      definirDestinoECalcular(e.latlng.lat, e.latlng.lng);
    });

    // Roteador de ciclovias OSRM
    async function definirDestinoECalcular(destLat, destLng) {
      if (marcadorDestino) {
        marcadorDestino.setLatLng([destLat, destLng]);
      } else {
        marcadorDestino = L.marker([destLat, destLng], { icon: iconeDestino }).addTo(map);
      }

      const origemStr = `${posAtual[1]},${posAtual[0]}`;
      const destinoStr = `${destLng},${destLat}`;
      const urlRota = `https://router.project-osrm.org/route/v1/bike/${origemStr};${destinoStr}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(urlRota);
        const data = await res.json();

        if (data.code === 'Ok' && data.routes.length > 0) {
          const rota = data.routes[0];
          
          if (linhaRota) map.removeLayer(linhaRota);

          // Rota brilhante na cor dourada GoTrix
          linhaRota = L.geoJSON(rota.geometry, {
            style: { 
              color: '#e2b245', 
              weight: 6, 
              opacity: 0.9,
              shadowColor: '#e2b245',
              shadowBlur: 10
            }
          }).addTo(map);

          map.fitBounds(linhaRota.getBounds(), { padding: [80, 160] });

          const distanciaKm = (rota.distance / 1000).toFixed(1);
          const tempoMinutos = Math.round((rota.distance / 1000) / 20 * 60);

          document.getElementById('distancia-texto').innerText = `${distanciaKm} km`;
          document.getElementById('tempo-texto').innerText = `${tempoMinutos < 1 ? 1 : tempoMinutos} min`;
          document.getElementById('info-rota').classList.remove('hidden');
        }
      } catch (e) {
        alert("Erro ao traçar rota por ciclovia.");
      }
    }

    iniciarGPS();
  </script>
</body>
</html>
