<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CicloGPS - Rotas e Mapa CyclOSM</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS (Mapa Gratuito) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
  </style>
</head>
<body class="bg-gray-900 text-white font-sans">

  <!-- Painel Flutuante Superior (Busca e Controles) -->
  <div class="fixed top-4 left-4 right-4 z-10 max-w-md mx-auto bg-gray-900/95 backdrop-blur-md p-4 rounded-2xl shadow-2xl border border-gray-800">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <h1 class="font-bold text-lg tracking-tight">CicloGPS</h1>
      </div>
      
      <div class="flex items-center gap-1.5">
        <!-- Botão Alternar Camada CyclOSM / Limpo -->
        <button id="btn-camada" onclick="alternarCamadaMapa()" class="text-xs bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 px-2.5 py-1.5 rounded-lg border border-blue-500/30 font-medium transition">
          Mapa: CyclOSM
        </button>
        <button onclick="centralizarUsuario()" class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1.5 rounded-lg border border-gray-700 transition">
          Meu GPS
        </button>
      </div>
    </div>

    <!-- Campo de Destino -->
    <div class="flex gap-2">
      <input 
        type="text" 
        id="destino-input" 
        placeholder="Para onde vamos? (ou toque no mapa)" 
        class="w-full bg-gray-800 text-sm text-white placeholder-gray-400 px-3.5 py-2.5 rounded-xl border border-gray-700 focus:outline-none focus:border-emerald-500"
        onkeypress="if(event.key === 'Enter') buscarEndereco()"
      />
      <button 
        onclick="buscarEndereco()" 
        class="bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-semibold px-4 py-2.5 rounded-xl text-sm transition shrink-0">
        Ir
      </button>
    </div>

    <!-- Painel de Informações da Rota (Oculto inicialmente) -->
    <div id="info-rota" class="hidden mt-3 pt-3 border-t border-gray-800 flex items-center justify-between text-sm">
      <div>
        <p class="text-gray-400 text-xs">Distância (Ciclovias/Vias leves)</p>
        <p id="distancia-texto" class="font-bold text-lg text-emerald-400">0 km</p>
      </div>
      <div class="text-right">
        <p class="text-gray-400 text-xs">Tempo Estimado (20 km/h)</p>
        <p id="tempo-texto" class="font-bold text-lg text-white">0 min</p>
      </div>
    </div>
  </div>

  <!-- Legenda Rápida do CyclOSM no canto inferior -->
  <div id="legenda-cyclosm" class="fixed bottom-5 left-4 z-10 bg-gray-900/90 backdrop-blur-md px-3 py-2 rounded-xl border border-gray-800 text-[11px] text-gray-300 shadow-lg flex items-center gap-3">
    <div class="flex items-center gap-1.5">
      <span class="w-4 h-1 bg-blue-600 inline-block rounded"></span>
      <span>Ciclovia</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="w-4 h-1 border-b-2 border-dashed border-blue-500 inline-block"></span>
      <span>Ciclofaixa</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="w-4 h-1 bg-emerald-500 inline-block rounded"></span>
      <span>Ciclorrota</span>
    </div>
  </div>

  <!-- Container do Mapa -->
  <div id="map"></div>

  <script>
    // Coordenada inicial padrão (São José dos Pinhais / Curitiba)
    let posAtual = [-25.5347, -49.2064]; 
    let marcadorUsuario = null;
    let marcadorDestino = null;
    let linhaRota = null;
    let usandoCyclOSM = true;

    // 1. Inicializa o Mapa
    const map = L.map('map', { zoomControl: false }).setView(posAtual, 15);
    
    // Camada 1: CyclOSM (Destaca todas as ciclovias, ciclofaixas, bicicletários e relevo)
    const camadaCyclOSM = L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap &copy; CyclOSM',
      maxZoom: 20
    });

    // Camada 2: CartoDB Voyager (Mapa urbano limpo para contraste)
    const camadaLimpa = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19
    });

    // Inicia com o CyclOSM ativo
    camadaCyclOSM.addTo(map);

    // Função para alternar entre CyclOSM e Mapa Limpo
    function alternarCamadaMapa() {
      const btn = document.getElementById('btn-camada');
      const legenda = document.getElementById('legenda-cyclosm');

      if (usandoCyclOSM) {
        map.removeLayer(camadaCyclOSM);
        camadaLimpa.addTo(map);
        btn.innerText = 'Mapa: Urbano';
        btn.className = 'text-xs bg-gray-800 text-gray-300 hover:bg-gray-700 px-2.5 py-1.5 rounded-lg border border-gray-700 font-medium transition';
        legenda.classList.add('hidden');
        usandoCyclOSM = false;
      } else {
        map.removeLayer(camadaLimpa);
        camadaCyclOSM.addTo(map);
        btn.innerText = 'Mapa: CyclOSM';
        btn.className = 'text-xs bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 px-2.5 py-1.5 rounded-lg border border-blue-500/30 font-medium transition';
        legenda.classList.remove('hidden');
        usandoCyclOSM = true;
      }
    }

    // Ícones customizados
    const iconeUsuario = L.divIcon({
      className: 'custom-div-icon',
      html: `<div style="background-color:#10b981; width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow: 0 0 12px rgba(16,185,129,0.9);"></div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    const iconeDestino = L.divIcon({
      className: 'custom-div-icon',
      html: `<div style="background-color:#ef4444; width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow: 0 0 12px rgba(239,68,68,0.9);"></div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    // 2. Ativa o GPS em tempo real do navegador
    function iniciarGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const primeiraVez = !marcadorUsuario;
            posAtual = [lat, lng];

            if (!marcadorUsuario) {
              marcadorUsuario = L.marker(posAtual, { icon: iconeUsuario }).addTo(map);
            } else {
              marcadorUsuario.setLatLng(posAtual);
            }

            if (primeiraVez) {
              map.setView(posAtual, 16);
            }
          },
          (erro) => {
            console.warn("Erro ao obter GPS:", erro.message);
            if (!marcadorUsuario) {
              marcadorUsuario = L.marker(posAtual, { icon: iconeUsuario }).addTo(map);
            }
          },
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
      }
    }

    function centralizarUsuario() {
      map.flyTo(posAtual, 16);
    }

    // 3. Busca endereço digitado usando API gratuita Photon (OpenStreetMap)
    async function buscarEndereco() {
      const query = document.getElementById('destino-input').value.trim();
      if (!query) return;

      try {
        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=${posAtual[0]}&lon=${posAtual[1]}&limit=1`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.features && data.features.length > 0) {
          const coords = data.features[0].geometry.coordinates;
          definirDestinoECalcular(coords[1], coords[0]);
        } else {
          alert("Endereço não encontrado. Tente incluir o nome da cidade.");
        }
      } catch (e) {
        alert("Erro ao buscar endereço.");
      }
    }

    // Permite tocar direto no mapa para traçar rota
    map.on('click', (e) => {
      definirDestinoECalcular(e.latlng.lat, e.latlng.lng);
    });

    // 4. Calcula a rota usando OSRM gratuito com perfil de bicicleta/ciclovia (bike)
    async function definirDestinoECalcular(destLat, destLng) {
      if (marcadorDestino) {
        marcadorDestino.setLatLng([destLat, destLng]);
      } else {
        marcadorDestino = L.marker([destLat, destLng], { icon: iconeDestino }).addTo(map);
      }

      const origemStr = `${posAtual[1]},${posAtual[0]}`;
      const destinoStr = `${destLng},${destLat}`;
      const urlRota = `https://router.project-osrm.org/route/v1/bike/${origemStr};${destinoStr}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(urlRota);
        const data = await res.json();

        if (data.code === 'Ok' && data.routes.length > 0) {
          const rota = data.routes[0];
          
          if (linhaRota) map.removeLayer(linhaRota);

          // Linha da rota com borda branca para se destacar bem sobre as linhas azuis do CyclOSM
          linhaRota = L.geoJSON(rota.geometry, {
            style: { 
              color: '#f97316', // Laranja vibrante para não confundir com as ciclovias azuis/verdes do CyclOSM
              weight: 6, 
              opacity: 0.9 
            }
          }).addTo(map);

          map.fitBounds(linhaRota.getBounds(), { padding: [80, 80] });

          const distanciaKm = (rota.distance / 1000).toFixed(1);
          const tempoMinutos = Math.round((rota.distance / 1000) / 20 * 60);

          document.getElementById('distancia-texto').innerText = `${distanciaKm} km`;
          document.getElementById('tempo-texto').innerText = `${tempoMinutos < 1 ? 1 : tempoMinutos} min`;
          document.getElementById('info-rota').classList.remove('hidden');
        }
      } catch (e) {
        alert("Não foi possível calcular a rota.");
      }
    }

    iniciarGPS();
  </script>
</body>
</html>
