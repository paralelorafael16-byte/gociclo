<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GoTrix - GPS para Mobilidade Urbana</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    body, html { 
      margin: 0; padding: 0; height: 100%; overflow: hidden; 
      font-family: 'Poppins', sans-serif;
      background-color: #0b0b0b;
    }

    /* Container ampliado para permitir rotação 360° do mapa sem mostrar bordas cortadas nos cantos */
    #map-viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background-color: #111111;
      z-index: 1;
    }

    #map { 
      position: absolute;
      width: 150vmax;
      height: 150vmax;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(0deg);
      transform-origin: center center;
      transition: transform 0.35s ease-out;
      background-color: #111111;
    }
    
    .mapa-escuro .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(95%) saturate(140%);
    }

    .scooter-wrapper {
      transition: transform 0.35s ease-out;
      transform-origin: center center;
    }
  </style>
</head>
<body class="text-white select-none">

  <!-- 1. BARRA SUPERIOR DE MANOBRA -->
  <header class="fixed top-0 left-0 right-0 z-20 bg-[#0a0a0a] border-b border-[#e2b245]/30 px-4 py-3.5 shadow-[0_8px_24px_rgba(0,0,0,0.85)]">
    <div class="max-w-md mx-auto flex items-center gap-4">
      <!-- Ícone da Próxima Manobra -->
      <div id="icone-manobra" class="w-12 h-12 flex items-center justify-center shrink-0 text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V9a4 4 0 0 1 4-4h6" />
          <polyline points="15 1 19 5 15 9" />
        </svg>
      </div>

      <!-- Distância e Nome da Rua -->
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between">
          <p id="distancia-manobra" class="text-2xl font-black tracking-tight text-white leading-none">
            Pronto
          </p>
          <span class="text-[10px] font-black italic tracking-wider text-[#e2b245] border border-[#e2b245]/40 px-2 py-0.5 rounded bg-[#e2b245]/10">
            GoTrix GPS
          </span>
        </div>
        <p id="rua-manobra" class="text-sm font-semibold text-[#e2b245] truncate mt-1">
          Toque na lupa abaixo ou no mapa
        </p>
      </div>
    </div>
  </header>

  <!-- BOTÃO DE BÚSSOLA FLUTUANTE (Canto Superior Direito) -->
  <div class="fixed top-24 right-4 z-20 flex flex-col items-end gap-1.5">
    <button id="btn-bussola" onclick="alternarModoBussola()" title="Orientar mapa pela direção" class="w-12 h-12 rounded-full bg-[#121212]/95 border-2 border-[#e2b245] shadow-[0_6px_18px_rgba(0,0,0,0.85)] flex items-center justify-center transition-all active:scale-95">
      <svg id="agulha-bussola" class="w-7 h-7 transition-transform duration-300" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#3f3f46" stroke-width="1.2"/>
        <polygon points="16,4 20,16 12,16" fill="#ef4444"/>
        <polygon points="16,28 20,16 12,16" fill="#e2b245"/>
        <circle cx="16" cy="16" r="2.2" fill="#0a0a0a" stroke="#ffffff" stroke-width="1"/>
      </svg>
    </button>
    <span id="label-bussola" class="text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-md bg-[#0a0a0a]/90 text-[#e2b245] border border-[#e2b245]/30 shadow">
      Bússola ON
    </span>
  </div>

  <!-- MODAL DE BUSCA -->
  <div id="modal-busca" class="hidden fixed inset-x-0 top-20 z-30 px-4">
    <div class="max-w-md mx-auto bg-[#121212]/98 backdrop-blur-md p-4 rounded-2xl border border-[#e2b245]/40 shadow-2xl">
      <div class="flex items-center justify-between mb-2.5">
        <span class="text-xs font-bold uppercase tracking-wider text-[#e2b245]">Definir Destino Eco</span>
        <button onclick="toggleBusca()" class="text-zinc-400 hover:text-white text-xs font-bold px-2 py-1">Fechar ✕</button>
      </div>
      <div class="flex gap-2">
        <input 
          type="text" 
          id="destino-input" 
          placeholder="Digite o endereço ou local..." 
          class="w-full min-w-0 bg-[#1a1a1a] text-sm text-white placeholder-zinc-500 px-3.5 py-2.5 rounded-xl border border-zinc-700 focus:outline-none focus:border-[#e2b245]"
          onkeypress="if(event.key === 'Enter') buscarEndereco()"
        />
        <button 
          onclick="buscarEndereco()" 
          class="bg-gradient-to-r from-yellow-400 to-[#e2b245] text-black font-extrabold px-5 py-2.5 rounded-xl text-sm shrink-0 whitespace-nowrap">
          Ir
        </button>
      </div>
      <div class="mt-2.5 flex items-center justify-between text-[11px] text-zinc-400">
        <span>Modo do mapa (Ciclovias):</span>
        <button id="btn-tema-mapa" onclick="alternarTemaMapa()" class="text-[#e2b245] font-bold underline">
          Escuro (Alternar para Original)
        </button>
      </div>
    </div>
  </div>

  <!-- BANNER PROMOCIONAL COMPACTO E FECHÁVEL -->
  <div id="ad-gotrix" class="fixed bottom-40 left-4 right-4 z-20 max-w-md mx-auto bg-[#121212]/95 backdrop-blur-md p-3 rounded-2xl border border-[#e2b245]/40 shadow-2xl transition-all duration-300">
    <button onclick="fecharAnuncio()" title="Fechar" class="absolute -top-2.5 -right-2.5 bg-[#1a1a1a] text-zinc-300 hover:text-[#e2b245] p-1.5 rounded-full border border-zinc-700 shadow">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-zinc-900 rounded-xl border border-[#e2b245]/30 flex items-center justify-center text-[#e2b245] shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="5.5" cy="17.5" r="2.5"/><circle cx="18.5" cy="17.5" r="2.5"/>
          <path d="M15 6h3l1.5 9"/><path d="M8 17.5h7l2-5.5h-4"/>
        </svg>
      </div>
      <div class="min-w-0 flex-1">
        <span class="text-[9px] uppercase tracking-wider text-[#e2b245] font-extrabold">Loja GoTrix Oficial</span>
        <p class="text-xs font-bold text-white truncate">Test-drive e peças para sua scooter!</p>
      </div>
      <a href="https://gotrixoficial.com.br" target="_blank" class="bg-[#e2b245] text-black font-extrabold text-[11px] px-3 py-2 rounded-xl shrink-0">
        Ver Loja
      </a>
    </div>
  </div>

  <!-- ELEMENTOS FLUTUANTES ACIMA DO RODAPÉ -->
  <div class="fixed bottom-20 left-0 right-0 z-20 px-4 pointer-events-none">
    <div class="max-w-md mx-auto flex items-end justify-between">
      
      <!-- 2. INFERIOR ESQUERDO: Velocímetro Circular + Limite -->
      <div class="relative pointer-events-auto">
        <div class="absolute -top-2 -right-3 z-10 w-9 h-9 rounded-full bg-white border-[3px] border-red-500 flex items-center justify-center shadow-md">
          <span id="limite-via" class="text-black font-black text-xs leading-none">32</span>
        </div>

        <div class="w-20 h-20 rounded-full bg-[#141414]/95 border-2 border-zinc-700 shadow-[0_6px_20px_rgba(0,0,0,0.85)] flex flex-col items-center justify-center relative">
          <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="34" stroke="#27272a" stroke-width="5" fill="none" />
            <circle id="arco-velocidade" cx="40" cy="40" r="34" stroke="#e2b245" stroke-width="5" fill="none" stroke-dasharray="213" stroke-dashoffset="213" stroke-linecap="round" />
          </svg>
          <span id="velocidade-valor" class="text-2xl font-black text-white leading-none z-10">0</span>
          <span class="text-[10px] font-bold text-zinc-400 leading-none mt-0.5 z-10">km/h</span>
        </div>
      </div>

      <!-- 3. INFERIOR CENTRO: Pílula com nome da via -->
      <div class="mb-1 px-3 py-1 rounded-full bg-[#e2b245] text-black font-extrabold text-xs shadow-lg border border-black/20 max-w-[145px] truncate pointer-events-auto">
        <span id="via-atual-texto">Ciclovia / Via</span>
      </div>

      <!-- 4. INFERIOR DIREITO: Botão de Recentralizar Inteligente -->
      <div class="flex flex-col items-center pointer-events-auto">
        <button id="btn-recentralizar" onclick="recentralizarUsuario()" title="Recentralizar no meu GPS" class="w-14 h-14 rounded-full bg-gradient-to-br from-yellow-400 to-[#d97706] border-[3px] border-white shadow-[0_6px_20px_rgba(0,0,0,0.8)] flex items-center justify-center active:scale-95 transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
            <circle cx="12" cy="12" r="8" stroke-opacity="0.4"/>
          </svg>
        </button>
        <span id="badge-recentralizar" class="hidden mt-1 text-[9px] font-black uppercase bg-black/90 text-[#e2b245] px-2 py-0.5 rounded-full border border-[#e2b245]/50 shadow">
          Recentralizar
        </span>
      </div>

    </div>
  </div>

  <!-- 5. RODAPÉ FIXO -->
  <footer class="fixed bottom-0 left-0 right-0 z-20 h-16 bg-[#111111] border-t border-zinc-800 shadow-[0_-4px_20px_rgba(0,0,0,0.8)]">
    <div class="max-w-md mx-auto h-full grid grid-cols-4 items-center">
      <button onclick="toggleBusca()" class="h-full flex items-center justify-center border-r border-zinc-800 text-zinc-300 hover:text-[#e2b245] active:bg-zinc-900 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>

      <div onclick="toggleBusca()" class="col-span-2 h-full flex flex-col items-center justify-center px-2 cursor-pointer active:bg-zinc-900 transition">
        <div class="flex items-center gap-2">
          <span id="hora-chegada" class="text-lg font-black text-white leading-none">--:--</span>
          <span id="badge-relevo" class="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400">
            Plano ⚡
          </span>
        </div>
        <div class="flex items-center gap-1.5 text-xs font-bold text-zinc-400 mt-1">
          <span id="tempo-texto">0 min</span>
          <span class="w-4 h-4 rounded-full bg-[#e2b245] text-black inline-flex items-center justify-center text-[10px]">⌄</span>
          <span id="distancia-texto">0 km</span>
        </div>
      </div>

      <button onclick="abrirAnuncio()" class="h-full flex flex-col items-center justify-center border-l border-zinc-800 text-[#e2b245] hover:bg-zinc-900 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="5" r="2"/><path d="M12 9v6m0 0l-3 5m3-5l3 5M7 11l5-2 5 2"/>
        </svg>
      </button>
    </div>
  </footer>

  <!-- Viewport ampliado para rotação suave sem cortes -->
  <div id="map-viewport">
    <div id="map" class="mapa-escuro"></div>
  </div>

  <script>
    let posAtual = [-25.5347, -49.2064]; 
    let posAnterior = null;
    let anguloAtual = 0;
    let marcadorUsuario = null;
    let marcadorDestino = null;
    let linhaRota = null;
    let mapaEscuroAtivo = true;

    let modoBussolaAtivo = true;
    let seguirUsuario = true;

    const map = L.map('map', { zoomControl: false }).setView(posAtual, 17);
    
    L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap &copy; CyclOSM',
      maxZoom: 20
    }).addTo(map);

    // Pausa o seguimento automático quando o usuário arrasta o mapa manualmente
    map.on('dragstart', () => {
      seguirUsuario = false;
      const btn = document.getElementById('btn-recentralizar');
      const badge = document.getElementById('badge-recentralizar');
      btn.classList.add('ring-4', 'ring-[#e2b245]/60', 'animate-pulse');
      badge.classList.remove('hidden');
    });

    // Recentraliza a câmera e reativa o seguimento
    function recentralizarUsuario() {
      seguirUsuario = true;
      const btn = document.getElementById('btn-recentralizar');
      const badge = document.getElementById('badge-recentralizar');
      btn.classList.remove('ring-4', 'ring-[#e2b245]/60', 'animate-pulse');
      badge.classList.add('hidden');

      map.flyTo(posAtual, 17, { duration: 0.6 });
      aplicarOrientacaoMapa(anguloAtual);
    }

    // Alterna entre Modo Bússola (Proa para cima) e Modo Norte Fixo
    async function alternarModoBussola() {
      modoBussolaAtivo = !modoBussolaAtivo;
      const btn = document.getElementById('btn-bussola');
      const label = document.getElementById('label-bussola');

      if (modoBussolaAtivo && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
      }

      if (modoBussolaAtivo) {
        btn.classList.add('border-[#e2b245]');
        btn.classList.remove('border-zinc-600');
        label.innerText = 'Bússola ON';
        label.className = 'text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-md bg-[#0a0a0a]/90 text-[#e2b245] border border-[#e2b245]/30 shadow';
      } else {
        btn.classList.remove('border-[#e2b245]');
        btn.classList.add('border-zinc-600');
        label.innerText = 'Norte Fixo';
        label.className = 'text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-md bg-[#0a0a0a]/90 text-zinc-400 border border-zinc-700 shadow';
      }

      aplicarOrientacaoMapa(anguloAtual);
    }

    // Aplica a rotação no mapa, na agulha da bússola e no cursor da scooter
    function aplicarOrientacaoMapa(rumoGraus) {
      if (rumoGraus === null || isNaN(rumoGraus)) return;
      anguloAtual = rumoGraus;

      const mapEl = document.getElementById('map');
      const scooterEl = document.getElementById('scooter-cursor');
      const agulhaEl = document.getElementById('agulha-bussola');

      if (modoBussolaAtivo) {
        mapEl.style.transform = `translate(-50%, -50%) rotate(${-anguloAtual}deg)`;
        if (scooterEl) scooterEl.style.transform = `rotate(${anguloAtual}deg)`;
        if (agulhaEl) agulhaEl.style.transform = `rotate(${-anguloAtual}deg)`;
      } else {
        mapEl.style.transform = `translate(-50%, -50%) rotate(0deg)`;
        if (scooterEl) scooterEl.style.transform = `rotate(${anguloAtual}deg)`;
        if (agulhaEl) agulhaEl.style.transform = `rotate(0deg)`;
      }
    }

    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);

    function handleOrientation(event) {
      if (!modoBussolaAtivo) return;
      let bussolaGraus = null;

      if (event.webkitCompassHeading !== undefined) {
        bussolaGraus = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        bussolaGraus = (360 - event.alpha) % 360;
      }

      if (bussolaGraus !== null && !isNaN(bussolaGraus)) {
        aplicarOrientacaoMapa(bussolaGraus);
      }
    }

    function toggleBusca() {
      const modal = document.getElementById('modal-busca');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('destino-input').focus();
      }
    }

    function alternarTemaMapa() {
      const mapDiv = document.getElementById('map');
      const btn = document.getElementById('btn-tema-mapa');
      if (mapaEscuroAtivo) {
        mapDiv.classList.remove('mapa-escuro');
        btn.innerText = 'Original (Alternar para Escuro)';
        mapaEscuroAtivo = false;
      } else {
        mapDiv.classList.add('mapa-escuro');
        btn.innerText = 'Escuro (Alternar para Original)';
        mapaEscuroAtivo = true;
      }
    }

    const iconeScooterWaze = L.divIcon({
      className: 'custom-scooter-icon',
      html: `
        <div id="scooter-cursor" class="scooter-wrapper" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;">
          <svg width="56" height="56" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="farolGrad" x1="32" y1="2" x2="32" y2="22" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#fde047" stop-opacity="0"/>
                <stop offset="100%" stop-color="#e2b245" stop-opacity="0.55"/>
              </linearGradient>
              <filter id="sombraScooter" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.85"/>
              </filter>
            </defs>
            <circle cx="32" cy="34" r="22" fill="#e2b245" fill-opacity="0.14" stroke="#e2b245" stroke-opacity="0.35" stroke-width="1"/>
            <path d="M18 4 L46 4 L37 22 L27 22 Z" fill="url(#farolGrad)"/>
            <g filter="url(#sombraScooter)">
              <rect x="29.5" y="13" width="5" height="9" rx="2.5" fill="#18181b" stroke="#e2b245" stroke-width="1"/>
              <rect x="17" y="21.5" width="30" height="3.2" rx="1.6" fill="#e2b245"/>
              <circle cx="16.5" cy="21" r="2.2" fill="#111111" stroke="#e2b245" stroke-width="1.2"/>
              <circle cx="47.5" cy="21" r="2.2" fill="#111111" stroke="#e2b245" stroke-width="1.2"/>
              <ellipse cx="32" cy="19.5" rx="3.2" ry="1.8" fill="#fef08a"/>
              <rect x="24" y="22" width="16" height="25" rx="7" fill="#121212" stroke="#e2b245" stroke-width="2"/>
              <rect x="27" y="26" width="10" height="9" rx="2" fill="#27272a"/>
              <rect x="26" y="36" width="12" height="10" rx="4" fill="#e2b245"/>
              <rect x="28" y="46.5" width="8" height="2" rx="1" fill="#ef4444"/>
            </g>
          </svg>
        </div>
      `,
      iconSize: [56, 56],
      iconAnchor: [28, 28]
    });

    const iconeDestino = L.divIcon({
      className: 'custom-div-icon',
      html: `<div style="background-color:#ef4444; width:18px; height:18px; border-radius:50%; border:3px solid #ffffff; box-shadow: 0 0 15px rgba(239,68,68,0.9);"></div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    function calcularDirecao(lat1, lon1, lat2, lon2) {
      const toRad = (deg) => deg * Math.PI / 180;
      const toDeg = (rad) => rad * 180 / Math.PI;
      const dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function atualizarVelocimetro(kmh) {
      const valEl = document.getElementById('velocidade-valor');
      const arcoEl = document.getElementById('arco-velocidade');
      valEl.innerText = kmh;

      if (kmh > 32) {
        valEl.className = "text-2xl font-black text-red-500 leading-none z-10";
        arcoEl.setAttribute("stroke", "#ef4444");
      } else {
        valEl.className = "text-2xl font-black text-white leading-none z-10";
        arcoEl.setAttribute("stroke", "#e2b245");
      }

      const maxKmh = 50;
      const perimetro = 213;
      const progresso = Math.min(kmh / maxKmh, 1);
      arcoEl.style.strokeDashoffset = perimetro - (perimetro * progresso);
    }

    function fecharAnuncio() {
      document.getElementById('ad-gotrix').classList.add('hidden');
    }

    function abrirAnuncio() {
      document.getElementById('ad-gotrix').classList.remove('hidden');
    }

    function iniciarGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const heading = position.coords.heading;
            const speedMs = position.coords.speed;
            const primeiraVez = !marcadorUsuario;
            
            posAtual = [lat, lng];

            const kmh = (speedMs !== null && !isNaN(speedMs) && speedMs >= 0) ? Math.round(speedMs * 3.6) : 0;
            atualizarVelocimetro(kmh);

            if (!marcadorUsuario) {
              marcadorUsuario = L.marker(posAtual, { icon: iconeScooterWaze, zIndexOffset: 1000 }).addTo(map);
            } else {
              marcadorUsuario.setLatLng(posAtual);
            }

            if (heading !== null && !isNaN(heading) && kmh > 2) {
              aplicarOrientacaoMapa(heading);
            } else if (posAnterior && (posAnterior[0] !== lat || posAnterior[1] !== lng)) {
              aplicarOrientacaoMapa(calcularDirecao(posAnterior[0], posAnterior[1], lat, lng));
            }

            posAnterior = [lat, lng];

            if (primeiraVez || seguirUsuario) {
              map.setView(posAtual, map.getZoom(), { animate: !primeiraVez });
            }
          },
          () => {
            if (!marcadorUsuario) marcadorUsuario = L.marker(posAtual, { icon: iconeScooterWaze, zIndexOffset: 1000 }).addTo(map);
          },
          { enableHighAccuracy: true, maximumAge: 1500, timeout: 10000 }
        );
      }
    }

    async function buscarEndereco() {
      const query = document.getElementById('destino-input').value.trim();
      if (!query) return;

      try {
        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=${posAtual[0]}&lon=${posAtual[1]}&limit=1`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.features && data.features.length > 0) {
          const coords = data.features[0].geometry.coordinates;
          const nomeDestino = data.features[0].properties.name || query;
          document.getElementById('modal-busca').classList.add('hidden');
          definirDestinoECalcular(coords[1], coords[0], nomeDestino);
        } else {
          alert("Nenhum local encontrado.");
        }
      } catch (e) {
        alert("Erro na busca.");
      }
    }

    map.on('click', (e) => {
      definirDestinoECalcular(e.latlng.lat, e.latlng.lng, "Destino no mapa");
    });

    async function definirDestinoECalcular(destLat, destLng, nomeLocal = "Destino") {
      if (marcadorDestino) {
        marcadorDestino.setLatLng([destLat, destLng]);
      } else {
        marcadorDestino = L.marker([destLat, destLng], { icon: iconeDestino }).addTo(map);
      }

      const origemStr = `${posAtual[1]},${posAtual[0]}`;
      const destinoStr = `${destLng},${destLat}`;
      const urlRota = `https://router.project-osrm.org/route/v1/bike/${origemStr};${destinoStr}?overview=full&steps=true&geometries=geojson`;

      try {
        const res = await fetch(urlRota);
        const data = await res.json();

        if (data.code === 'Ok' && data.routes.length > 0) {
          const rota = data.routes[0];
          
          if (linhaRota) map.removeLayer(linhaRota);

          linhaRota = L.geoJSON(rota.geometry, {
            style: { color: '#e2b245', weight: 7, opacity: 0.95 }
          }).addTo(map);

          if (rota.geometry.coordinates && rota.geometry.coordinates.length > 1) {
            const p1 = rota.geometry.coordinates[0];
            const p2 = rota.geometry.coordinates[1];
            aplicarOrientacaoMapa(calcularDirecao(p1[1], p1[0], p2[1], p2[0]));
          }

          recentralizarUsuario();

          const passos = rota.legs[0].steps;
          if (passos && passos.length > 0) {
            const proxPasso = passos.length > 1 ? passos[1] : passos[0];
            const distPasso = proxPasso.distance >= 1000 
              ? `${(proxPasso.distance / 1000).toFixed(1)} km` 
              : `${Math.round(proxPasso.distance)} m`;
            
            document.getElementById('distancia-manobra').innerText = distPasso;
            document.getElementById('rua-manobra').innerText = proxPasso.name || nomeLocal;
            document.getElementById('via-atual-texto').innerText = passos[0].name || "Via Local";
          }

          const distanciaKm = (rota.distance / 1000).toFixed(1);
          const tempoMinutos = Math.max(1, Math.round((rota.distance / 1000) / 20 * 60));

          const chegada = new Date(Date.now() + tempoMinutos * 60000);
          const horaFormatada = chegada.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

          document.getElementById('hora-chegada').innerText = horaFormatada;
          document.getElementById('distancia-texto').innerText = `${distanciaKm} km`;
          document.getElementById('tempo-texto').innerText = `${tempoMinutos} min`;

          const badgeRelevo = document.getElementById('badge-relevo');
          if (distanciaKm > 4) {
            badgeRelevo.innerText = "Subidas ⚠️";
            badgeRelevo.className = "text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-yellow-500/20 text-yellow-400";
          } else {
            badgeRelevo.innerText = "Plano ⚡";
            badgeRelevo.className = "text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400";
          }
        }
      } catch (e) {
        alert("Erro ao traçar rota.");
      }
    }

    iniciarGPS();
  </script>
</body>
</html>
