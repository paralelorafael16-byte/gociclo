<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GoTrix - GPS para Mobilidade Urbana</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    body, html { 
      margin: 0; padding: 0; height: 100%; overflow: hidden; 
      font-family: 'Poppins', sans-serif;
      background-color: #0b0b0b;
    }
    #map { height: 100vh; width: 100vw; z-index: 1; background-color: #111111; }
    
    .mapa-escuro .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(95%) saturate(140%);
    }

    .scooter-wrapper {
      transition: transform 0.35s ease-out;
      transform-origin: center center;
    }
  </style>
</head>
<body class="text-white">

  <!-- Painel Superior (Marca, Busca e Controles) -->
  <div class="fixed top-4 left-4 right-4 z-10 max-w-md mx-auto bg-[#0f0f0f]/95 backdrop-blur-md p-4 rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.8)] border border-[#e2b245]/30">
    <div class="flex items-center justify-between mb-3">
      <!-- Identidade GoTrix -->
      <div class="flex items-center gap-1">
        <span class="text-2xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-[#e2b245] to-yellow-500">
          Go<span class="text-white">Trix</span>
        </span>
        <span class="text-[9px] uppercase tracking-widest text-[#e2b245] font-bold border border-[#e2b245]/30 px-1.5 py-0.5 rounded-md ml-1.5 bg-[#e2b245]/10">
          ECO GPS
        </span>
      </div>
      
      <div class="flex items-center gap-1.5">
        <button id="btn-tema-mapa" onclick="alternarTemaMapa()" class="text-xs bg-[#1a1a1a] hover:bg-[#262626] text-zinc-300 font-medium px-2.5 py-1.5 rounded-lg border border-zinc-700 transition-all">
          Mapa: Escuro
        </button>
        <button onclick="centralizarUsuario()" class="text-xs bg-[#1a1a1a] hover:bg-[#262626] text-[#e2b245] hover:text-yellow-400 font-semibold px-2.5 py-1.5 rounded-lg border border-[#e2b245]/30 transition-all flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          GPS
        </button>
      </div>
    </div>

    <!-- Campo de Busca -->
    <div class="flex gap-2">
      <input 
        type="text" 
        id="destino-input" 
        placeholder="Para onde vamos economizando bateria?" 
        class="w-full min-w-0 bg-[#161616] text-sm text-white placeholder-gray-500 px-3.5 py-2.5 rounded-xl border border-zinc-800 focus:outline-none focus:border-[#e2b245] transition"
        onkeypress="if(event.key === 'Enter') buscarEndereco()"
      />
      <button 
        onclick="buscarEndereco()" 
        class="bg-gradient-to-r from-yellow-400 to-[#e2b245] hover:brightness-110 text-black font-extrabold px-5 py-2.5 rounded-xl text-sm transition-all shadow-[0_0_15px_rgba(226,178,69,0.25)] shrink-0 whitespace-nowrap">
        Ir
      </button>
    </div>

    <!-- Painel de Informações da Rota & Economia de Bateria -->
    <div id="info-rota" class="hidden mt-3 pt-3 border-t border-zinc-800 grid grid-cols-3 gap-2 text-center text-sm">
      <div>
        <p class="text-zinc-400 text-[9px] uppercase font-bold tracking-wider">Distância</p>
        <p id="distancia-texto" class="font-extrabold text-base text-white">0 km</p>
      </div>
      <div>
        <p class="text-zinc-400 text-[9px] uppercase font-bold tracking-wider">Tempo</p>
        <p id="tempo-texto" class="font-extrabold text-base text-[#e2b245]">0 min</p>
      </div>
      <div>
        <p class="text-zinc-400 text-[9px] uppercase font-bold tracking-wider">Relevo / Bateria</p>
        <p id="relevo-texto" class="font-extrabold text-xs text-green-400 mt-1">Plano ⚡</p>
      </div>
    </div>
  </div>

  <!-- Indicador de Velocidade Flutuante (Estilo Waze / Foco em Autonomia) -->
  <div class="fixed top-36 left-4 z-10 bg-[#0f0f0f]/90 backdrop-blur-md px-3 py-2 rounded-xl border border-[#e2b245]/30 shadow-lg flex flex-col items-center">
    <span id="velocidade-valor" class="text-2xl font-black text-[#e2b245] tracking-tight">0</span>
    <span class="text-[9px] uppercase tracking-widest text-zinc-400 font-bold">km/h</span>
  </div>

  <!-- Banner Promocional do Rodapé (Compacto e Fechável) -->
  <div id="ad-gotrix" class="fixed bottom-6 left-4 right-4 z-10 max-w-md mx-auto bg-[#121212]/95 backdrop-blur-md p-3.5 rounded-2xl border border-[#e2b245]/30 shadow-[0_10px_30px_rgba(0,0,0,0.85)] transition-all duration-300">
    <button onclick="fecharAnuncio()" title="Fechar anúncio" class="absolute -top-2.5 -right-2.5 bg-[#1a1a1a] hover:bg-zinc-800 text-zinc-300 hover:text-[#e2b245] p-1.5 rounded-full border border-zinc-700 shadow-md transition-all">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>

    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-zinc-900 rounded-xl border border-[#e2b245]/20 flex-shrink-0 flex items-center justify-center text-[#e2b245]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5.5" cy="17.5" r="2.5"/>
          <circle cx="18.5" cy="17.5" r="2.5"/>
          <path d="M15 6h3l1.5 9"/>
          <path d="M8 17.5h7l2-5.5h-4"/>
          <path d="M16 6h2"/>
        </svg>
      </div>

      <div class="flex-grow min-w-0">
        <span class="text-[9px] uppercase tracking-widest text-[#e2b245] font-extrabold bg-[#e2b245]/10 px-1.5 py-0.5 rounded">
          GoTrix Mobilidade
        </span>
        <h3 class="text-xs font-bold text-white mt-1 truncate">Sua scooter nova está aqui!</h3>
        <p class="text-[11px] text-zinc-300 truncate">Rua Sete de Setembro, 123 - Centro</p>
      </div>

      <a href="https://gotrixoficial.com.br" target="_blank" class="bg-gradient-to-r from-yellow-400 to-[#e2b245] hover:brightness-110 text-black font-extrabold text-xs px-3.5 py-2.5 rounded-xl transition-all shrink-0 whitespace-nowrap">
        Conhecer
      </a>
    </div>
  </div>

  <button id="btn-reabrir-ad" onclick="abrirAnuncio()" title="Ver ofertas GoTrix" class="hidden fixed bottom-6 right-4 z-10 bg-[#121212] text-[#e2b245] p-3 rounded-full border border-[#e2b245]/40 shadow-xl hover:bg-zinc-900 transition-all">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5a2 2 0 10-2 2h2z" /></svg>
  </button>

  <div id="map" class="mapa-escuro"></div>

  <script>
    let posAtual = [-25.5347, -49.2064]; 
    let posAnterior = null;
    let anguloAtual = 0;
    let marcadorUsuario = null;
    let marcadorDestino = null;
    let linhaRota = null;
    let mapaEscuroAtivo = true;

    const map = L.map('map', { zoomControl: false }).setView(posAtual, 16);
    
    // Camada CyclOSM (Exibe ciclovias detalhadas e infraestrutura cicloviária)
    L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap &copy; CyclOSM',
      maxZoom: 20
    }).addTo(map);

    function alternarTemaMapa() {
      const mapDiv = document.getElementById('map');
      const btn = document.getElementById('btn-tema-mapa');
      if (mapaEscuroAtivo) {
        mapDiv.classList.remove('mapa-escuro');
        btn.innerText = 'Mapa: Original';
        mapaEscuroAtivo = false;
      } else {
        mapDiv.classList.add('mapa-escuro');
        btn.innerText = 'Mapa: Escuro';
        mapaEscuroAtivo = true;
      }
    }

    // Cursor Scooter estilo Waze com farol e rotação
    const iconeScooterWaze = L.divIcon({
      className: 'custom-scooter-icon',
      html: `
        <div id="scooter-cursor" class="scooter-wrapper" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;">
          <svg width="56" height="56" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="farolGrad" x1="32" y1="2" x2="32" y2="22" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#fde047" stop-opacity="0"/>
                <stop offset="100%" stop-color="#e2b245" stop-opacity="0.55"/>
              </linearGradient>
              <filter id="sombraScooter" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.85"/>
              </filter>
            </defs>
            <circle cx="32" cy="34" r="22" fill="#e2b245" fill-opacity="0.14" stroke="#e2b245" stroke-opacity="0.35" stroke-width="1"/>
            <path d="M18 4 L46 4 L37 22 L27 22 Z" fill="url(#farolGrad)"/>
            <g filter="url(#sombraScooter)">
              <rect x="29.5" y="13" width="5" height="9" rx="2.5" fill="#18181b" stroke="#e2b245" stroke-width="1"/>
              <rect x="17" y="21.5" width="30" height="3.2" rx="1.6" fill="#e2b245"/>
              <circle cx="16.5" cy="21" r="2.2" fill="#111111" stroke="#e2b245" stroke-width="1.2"/>
              <circle cx="47.5" cy="21" r="2.2" fill="#111111" stroke="#e2b245" stroke-width="1.2"/>
              <ellipse cx="32" cy="19.5" rx="3.2" ry="1.8" fill="#fef08a"/>
              <rect x="24" y="22" width="16" height="25" rx="7" fill="#121212" stroke="#e2b245" stroke-width="2"/>
              <rect x="27" y="26" width="10" height="9" rx="2" fill="#27272a"/>
              <rect x="26" y="36" width="12" height="10" rx="4" fill="#e2b245"/>
              <rect x="28" y="46.5" width="8" height="2" rx="1" fill="#ef4444"/>
            </g>
          </svg>
        </div>
      `,
      iconSize: [56, 56],
      iconAnchor: [28, 28]
    });

    const iconeDestino = L.divIcon({
      className: 'custom-div-icon',
      html: `<div style="background-color:#ef4444; width:18px; height:18px; border-radius:50%; border:3px solid #ffffff; box-shadow: 0 0 15px rgba(239,68,68,0.9);"></div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    function calcularDirecao(lat1, lon1, lat2, lon2) {
      const toRad = (deg) => deg * Math.PI / 180;
      const toDeg = (rad) => rad * 180 / Math.PI;
      const dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function atualizarRotacaoScooter(novoAngulo) {
      if (novoAngulo !== null && !isNaN(novoAngulo)) {
        anguloAtual = novoAngulo;
        const el = document.getElementById('scooter-cursor');
        if (el) el.style.transform = `rotate(${anguloAtual}deg)`;
      }
    }

    function fecharAnuncio() {
      const banner = document.getElementById('ad-gotrix');
      const btnAbrir = document.getElementById('btn-reabrir-ad');
      banner.style.opacity = '0';
      banner.style.transform = 'translateY(20px)';
      setTimeout(() => { banner.classList.add('hidden'); btnAbrir.classList.remove('hidden'); }, 300);
    }

    function abrirAnuncio() {
      const banner = document.getElementById('ad-gotrix');
      const btnAbrir = document.getElementById('btn-reabrir-ad');
      btnAbrir.classList.add('hidden');
      banner.classList.remove('hidden');
      setTimeout(() => { banner.style.opacity = '1'; banner.style.transform = 'translateY(0)'; }, 50);
    }

    function iniciarGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const heading = position.coords.heading;
            const speedMs = position.coords.speed; // Velocidade em metros por segundo
            const primeiraVez = !marcadorUsuario;
            
            posAtual = [lat, lng];

            // Atualiza Velocímetro na tela (converte m/s para km/h)
            if (speedMs !== null && !isNaN(speedMs) && speedMs >= 0) {
              const kmh = Math.round(speedMs * 3.6);
              document.getElementById('velocidade-valor').innerText = kmh;
            } else if (posAnterior) {
              // Estimativa caso o navegador não retorne speed direto
              document.getElementById('velocidade-valor').innerText = "0";
            }

            if (!marcadorUsuario) {
              marcadorUsuario = L.marker(posAtual, { icon: iconeScooterWaze, zIndexOffset: 1000 }).addTo(map);
            } else {
              marcadorUsuario.setLatLng(posAtual);
            }

            if (heading !== null && !isNaN(heading)) {
              atualizarRotacaoScooter(heading);
            } else if (posAnterior && (posAnterior[0] !== lat || posAnterior[1] !== lng)) {
              const anguloCalculado = calcularDirecao(posAnterior[0], posAnterior[1], lat, lng);
              atualizarRotacaoScooter(anguloCalculado);
            }

            posAnterior = [lat, lng];
            if (primeiraVez) map.setView(posAtual, 17);
          },
          (erro) => {
            console.warn("Erro ao obter GPS:", erro.message);
            if (!marcadorUsuario) marcadorUsuario = L.marker(posAtual, { icon: iconeScooterWaze, zIndexOffset: 1000 }).addTo(map);
          },
          { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
        );
      }
    }

    function centralizarUsuario() {
      map.flyTo(posAtual, 17);
    }

    async function buscarEndereco() {
      const query = document.getElementById('destino-input').value.trim();
      if (!query) return;

      try {
        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=${posAtual[0]}&lon=${posAtual[1]}&limit=1`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.features && data.features.length > 0) {
          const coords = data.features[0].geometry.coordinates;
          definirDestinoECalcular(coords[1], coords[0]);
        } else {
          alert("Nenhum local encontrado.");
        }
      } catch (e) {
        alert("Erro na busca.");
      }
    }

    map.on('click', (e) => {
      definirDestinoECalcular(e.latlng.lat, e.latlng.lng);
    });

    async function definirDestinoECalcular(destLat, destLng) {
      if (marcadorDestino) {
        marcadorDestino.setLatLng([destLat, destLng]);
      } else {
        marcadorDestino = L.marker([destLat, destLng], { icon: iconeDestino }).addTo(map);
      }

      const origemStr = `${posAtual[1]},${posAtual[0]}`;
      const destinoStr = `${destLng},${destLat}`;
      // Usamos o perfil de bike do OSRM otimizado para ciclovias
      const urlRota = `https://router.project-osrm.org/route/v1/bike/${origemStr};${destinoStr}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(urlRota);
        const data = await res.json();

        if (data.code === 'Ok' && data.routes.length > 0) {
          const rota = data.routes[0];
          
          if (linhaRota) map.removeLayer(linhaRota);

          // Rota em destaque com a cor Dourada GoTrix
          linhaRota = L.geoJSON(rota.geometry, {
            style: { 
              color: '#e2b245', 
              weight: 7, 
              opacity: 0.95
            }
          }).addTo(map);

          if (rota.geometry.coordinates && rota.geometry.coordinates.length > 1) {
            const p1 = rota.geometry.coordinates[0];
            const p2 = rota.geometry.coordinates[1];
            atualizarRotacaoScooter(calcularDirecao(p1[1], p1[0], p2[1], p2[0]));
          }

          map.fitBounds(linhaRota.getBounds(), { padding: [90, 140] });

          const distanciaKm = (rota.distance / 1000).toFixed(1);
          const tempoMinutos = Math.round((rota.distance / 1000) / 20 * 60);

          document.getElementById('distancia-texto').innerText = `${distanciaKm} km`;
          document.getElementById('tempo-texto').innerText = `${tempoMinutos < 1 ? 1 : tempoMinutos} min`;
          
          // Simulação inteligente de análise de relevo para economia de bateria
          const elementoRelevo = document.getElementById('relevo-texto');
          if (distanciaKm > 4) {
            elementoRelevo.innerText = "Moderado ⚠️";
            elementoRelevo.className = "font-extrabold text-xs text-yellow-400 mt-1";
          } else {
            elementoRelevo.innerText = "Plano ⚡";
            elementoRelevo.className = "font-extrabold text-xs text-green-400 mt-1";
          }

          document.getElementById('info-rota').classList.remove('hidden');
        }
      } catch (e) {
        alert("Erro ao traçar rota econômica.");
      }
    }

    iniciarGPS();
  </script>
</body>
</html>
